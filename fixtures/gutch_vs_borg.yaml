name: gutch_vs_borg
description: Borg 2 keeps default FastCDC (about 2 MiB, normalization 2), LZ4 and
  cache policy. Repository creation uses --encryption authenticated-sha256: payloads
  are unencrypted but authenticated, with a fixed local test passphrase protecting
  the key. Restore and recovery use --continue for the shared output directory;
  repository check uses --verify-data. Gutch
  uses unencrypted FastCDC with a 2 MiB target, LZ4 0 and 8 MiB bundles. Normalization,
  chunk bounds, hash algorithms, LZ4 framing and storage layout differ. Borg resume
  uses metadata checks; independent validation still checks contents. Fresh local
  repositories and isolated caches; automatic workers; noninteractive/output flags.
  One warm-up and three rotating measured repetitions, profiling off. Independent
  validation is outside timings; extra files are allowed.
dataset: blender/fixture.yaml
repetitions: 3
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  borg: borg
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_2MiB
    compression:
      algorithm: lz4
      level: 0
- label: borg
  tool: borg
