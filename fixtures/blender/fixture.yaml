# Paths in this file are relative to this fixture folder. Missing tools are reported.
name: blender
description: 'All-tools overview with normalized settings, not native performance
  defaults: Gutch FastCDC 1 MiB/Zstd 3; Restic Rabin about 1 MiB/Zstd auto; Kopia
  Buzhash 1 MiB/Zstd; Borg 2 FastCDC 1 MiB/Zstd 3; Plakar default FastCDC/LZ4; BPT
  1 MiB/internal compression. Encryption is disabled for Borg and Plakar, unavailable
  in Gutch/BPT local workflows, and mandatory for Kopia/Restic. Native recovery flags
  request extra deletion where available; restore/repository verification differs
  by tool. Chunk bounds, codecs, hashes, packing and metadata differ. Fresh local
  repositories and isolated caches; automatic workers; noninteractive/output flags.
  One warm-up and three rotating measured repetitions, profiling off. Independent
  validation is outside timings; extra files are allowed.'
repetitions: 3
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
builds:
- version: 5.0.0
  path: builds/blender-5.0.0-windows-x64
- version: 5.1.0
  path: builds/blender-5.1.0-windows-x64
executables:
  gutch: gutch-cli
  restic: restic
  kopia: kopia
  borg: borg
  plakar: plakar
  buildpatchtool: BuildPatchTool
lanes:
- label: filesystem
  tool: filesystem
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression: {algorithm: zstd, level: 3}
- label: restic
  tool: restic
  arguments: [--compression, auto]
- label: kopia
  tool: kopia
  arguments: [--compression=zstd, --splitter=DYNAMIC-1M-BUZHASH]
- label: borg
  tool: borg
  arguments: [--compression, "zstd,3", --chunker-params, "fastcdc,19,23,20,2"]
- label: plakar
  tool: plakar
- label: buildpatchtool
  tool: buildpatchtool
  arguments: [-ChunkWindowSize=1048576]
