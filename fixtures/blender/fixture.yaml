# Paths in this file are relative to this fixture folder. Missing tools are reported.
name: blender
description: Compare two pinned Blender builds with approximately 1 MiB chunks and comparable Zstd presets where supported.
repetitions: 3
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
builds:
- version: 5.2.0
  downloads:
    linux-x64:
      url: https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
      sha256: 96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48
    windows-x64:
      url: https://download.blender.org/release/Blender5.2/blender-5.2.0-windows-x64.zip
      sha256: 2d184b626c001692c362291911293b6a297179d618d95e9e9192c3a80318adc4
- version: 5.2.1
  downloads:
    linux-x64:
      url: https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
      sha256: a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9
    windows-x64:
      url: https://download.blender.org/release/Blender5.2/blender-5.2.1-windows-x64.zip
      sha256: 0e631dad7d0cad6d5d18abdd2e2550f6c0213215334eda00ddbd3d22b96ecb2c
executables:
  gutch: gutch-cli
  restic: restic
  kopia: kopia
  borg: borg
  plakar: plakar
  buildpatchtool: BuildPatchTool
lanes:
- label: filesystem
  tool: filesystem
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression: {algorithm: zstd, level: 3}
- label: restic
  tool: restic
  arguments: [--compression, auto]
- label: kopia
  tool: kopia
  arguments: [--compression=zstd, --splitter=DYNAMIC-1M-BUZHASH]
- label: borg
  tool: borg
  arguments: [--compression, "zstd,3", --chunker-params, "fastcdc,19,23,20,2"]
- label: plakar
  tool: plakar
- label: buildpatchtool
  tool: buildpatchtool
  arguments: [-ChunkWindowSize=1048576]
