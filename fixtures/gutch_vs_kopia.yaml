name: gutch_vs_kopia
description: Compare Gutch against kopia performance defaults on Blender.
dataset: blender/fixture.yaml
repetitions: 3
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  kopia: kopia
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_4MiB
    compression:
      algorithm: none
    bundle: bundle_16MiB
- label: kopia
  tool: kopia
