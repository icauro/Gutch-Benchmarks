name: gutch_vs_bpt
description: Compare Gutch against buildpatchtool performance defaults on Blender.
dataset: blender/fixture.yaml
repetitions: 3
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  buildpatchtool: BuildPatchTool
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression:
      algorithm: zstd
      level: 3
- label: buildpatchtool
  tool: buildpatchtool
