name: Manual Linux benchmarks
on:
  workflow_dispatch:
    inputs:
      pair:
        description: Run each selected Gutch-vs-tool pair in its own job
        type: choice
        default: all
        options: [all, borg, bpt, kopia, plakar, restic, rustic, encrypted]
      gutch_version:
        description: Gutch release to download, such as 0.1.0 (empty uses the tool manifest)
        type: string
        default: ''
      repetitions:
        description: Measured repetitions per pair (1-10), plus one warm-up
        type: choice
        default: '6'
        options: ['1', '2', '4', '6', '8', '10']
      cold_cache:
        description: Drop OS file caches before every command; results stay out of the README's latest view
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: manual-linux-benchmarks
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      pairs: ${{ steps.matrix.outputs.pairs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - id: matrix
        env:
          PAIR: ${{ inputs.pair }}
        run: python .github/scripts/benchmarks.py matrix --pair "$PAIR"
      - uses: ./.github/actions/blender-inputs
        with:
          populate: 'true'

  compare:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.inputs.outputs.pairs) }}
    env:
      PAIR: ${{ matrix.pair }}
      REPETITIONS: ${{ inputs.repetitions }}
      COLD_CACHE: ${{ inputs.cold_cache }}
      GUTCH_VERSION: ${{ inputs.gutch_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: ./.github/actions/blender-inputs
      - name: Install selected executables and fixture
        run: |
          python .github/scripts/benchmarks.py gutch --version "$GUTCH_VERSION"
          python .github/scripts/benchmarks.py tool --pair "$PAIR"
          python .github/scripts/benchmarks.py fixture --pair "$PAIR" --repetitions "$REPETITIONS"             $([ "$COLD_CACHE" = true ] && echo --cold-cache)
      - name: Compare one pair, discarding each case's outputs
        id: benchmark
        run: gutch-bench --fixture .artifacts/tools/ci/fixture.yaml --no-open-perfetto --discard-outputs
      - name: Collect reports and discard remaining outputs
        if: always() && steps.checkout.outcome == 'success'
        env:
          OUTCOME: ${{ steps.benchmark.outcome }}
        run: python .github/scripts/benchmarks.py collect --pair "$PAIR" --outcome "$OUTCOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-${{ matrix.pair }}
          path: .artifacts/benchmarks/export
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [inputs, compare]
    # Experimental branches retain artifacts but cannot update the default README.
    if: always() && !cancelled() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: benchmark-*
          path: .artifacts/incoming
      - name: Prepare tracked reports and README
        env:
          PAIR: ${{ inputs.pair }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: python .github/scripts/benchmarks.py publish --pair "$PAIR" --inputs .artifacts/incoming --run-id "$RUN_ID" --attempt "$ATTEMPT"
      - name: Commit compact reports
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md _docs/reports/
          git diff --cached --quiet && exit 0
          git commit -m "Record Linux benchmarks from run $RUN_ID"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
