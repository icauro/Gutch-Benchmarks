name: Manual Linux benchmarks
on:
  workflow_dispatch:
    inputs:
      pair:
        description: Run each selected Gutch-vs-tool pair in its own job
        type: choice
        default: all
        options: [all, borg, bpt, kopia, plakar, restic, rustic]
      gutch_ref:
        description: Branch, tag or commit in icauro/Gutch (resolved once per run)
        type: string
        default: main
      repetitions:
        description: Measured repetitions per pair (1-10), plus one warm-up
        type: choice
        default: '3'
        options: ['1', '2', '3', '5', '10']

permissions:
  contents: read
concurrency:
  group: manual-linux-benchmarks
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      pairs: ${{ steps.matrix.outputs.pairs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - id: matrix
        env:
          PAIR: ${{ inputs.pair }}
        run: python ci/benchmarks.py matrix --pair "$PAIR"
      - uses: ./.github/actions/blender-inputs
        with:
          populate: 'true'

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: icauro/Gutch
          ref: ${{ inputs.gutch_ref }}
          ssh-key: ${{ secrets.GUTCH_DEPLOY_KEY }}
          path: .artifacts/gutch-source
          persist-credentials: false
      - id: revision
        working-directory: .artifacts/gutch-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: gutch-dependencies-${{ runner.os }}-${{ hashFiles('.artifacts/gutch-source/Cargo.lock') }}
      - name: Build once for every pair
        working-directory: .artifacts/gutch-source
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo build --locked --release --package gutch-cli --target x86_64-unknown-linux-gnu
          python3 tools/package_cli.py --target x86_64-unknown-linux-gnu --toolchain stable
      - name: Package executable
        run: |
          mkdir -p .artifacts/build
          cp -a .artifacts/gutch-source/.builds/releases/x86_64-unknown-linux-gnu/. .artifacts/build/
          gzip .artifacts/build/gutch-cli
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          source = Path('.artifacts/gutch-source')
          record = {name: subprocess.check_output(command, cwd=source, text=True).strip()
                    for name, command in {'revision': ['git', 'rev-parse', 'HEAD'],
                                          'rustc': ['rustc', '--version'], 'cargo': ['cargo', '--version']}.items()}
          Path('.artifacts/build/provenance.json').write_text(json.dumps(record))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gutch-linux
          path: .artifacts/build/
          include-hidden-files: true
          retention-days: 7

  compare:
    needs: [inputs, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.inputs.outputs.pairs) }}
    env:
      PAIR: ${{ matrix.pair }}
      REPETITIONS: ${{ inputs.repetitions }}
      GUTCH_REVISION: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: ./.github/actions/blender-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gutch-linux
          path: .artifacts/build
      - name: Install selected executables and fixture
        run: |
          mkdir -p bin/linux-x64/gutch
          gzip -dc .artifacts/build/gutch-cli.gz > bin/linux-x64/gutch/gutch-cli
          chmod +x bin/linux-x64/gutch/gutch-cli
          python ci/benchmarks.py tool --pair "$PAIR"
          python ci/benchmarks.py fixture --pair "$PAIR" --repetitions "$REPETITIONS"
      - name: Compare one pair, discarding each case's outputs
        id: benchmark
        run: python run.py --fixture .artifacts/ci/fixture.yaml --no-open-perfetto --discard-outputs
      - name: Collect reports and discard remaining outputs
        if: always() && steps.checkout.outcome == 'success'
        env:
          OUTCOME: ${{ steps.benchmark.outcome }}
        run: python ci/benchmarks.py collect --pair "$PAIR" --outcome "$OUTCOME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-${{ matrix.pair }}
          path: .artifacts/export
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [inputs, build, compare]
    # Experimental branches retain artifacts but cannot update the default README.
    if: always() && !cancelled() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: benchmark-*
          path: .artifacts/incoming
      - name: Prepare tracked reports and README
        env:
          PAIR: ${{ inputs.pair }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: python ci/benchmarks.py publish --pair "$PAIR" --inputs .artifacts/incoming --run-id "$RUN_ID" --attempt "$ATTEMPT"
      - name: Commit compact reports
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md reports/
          git diff --cached --quiet && exit 0
          git commit -m "Record Linux benchmarks from run $RUN_ID"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
