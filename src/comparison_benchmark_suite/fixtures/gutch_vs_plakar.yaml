name: gutch_vs_plakar
description: Plakar keeps default FastCDC (about 1 MiB), LZ4 stream compression and
  backup-cache policy. Repository creation disables encryption with -plaintext; the
  adapter uses -stdio, -quiet and -no-progress. Recovery restores over existing output;
  repository check is separate. Gutch uses unencrypted FastCDC with a 1 MiB target,
  LZ4 0 and 8 MiB bundles. Chunk bounds, LZ4 implementation/framing, metadata and
  storage layout differ; stored Plakar level 9 is not passed to its stream writer.
  Fresh local repositories and isolated caches; automatic workers; noninteractive/output
  flags. One warm-up and three rotating measured repetitions, profiling off. Independent
  validation is outside timings; extra files are allowed.
dataset: blender/dataset.yaml
repetitions: 3
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  plakar: plakar
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression:
      algorithm: lz4
      level: 0
- label: plakar
  tool: plakar
