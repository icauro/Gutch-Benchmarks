name: gutch_vs_plakar
description: Plakar uses native FastCDC around 1 MiB and LZ4 stream compression, with plaintext storage.
  Gutch uses a nominal 1 MiB FastCDC target, LZ4 0 and 8 MiB compressed bundles. Bounds, compression
  units/framing and packing differ. Plakar restores over existing output; this adapter has no native
  extra-file deletion. Fresh repositories and isolated caches. Four workers where exposed; native
  Borg/BPT scheduling. One warm-up and six rotating measured repetitions; profiling off. Measurement
  contract 2 separates content repair, preserved-mtime damage, extra-file cleanup and full restoration.
  Strict source-derived SHA-256 validation follows every supported operation; both native and validation-inclusive
  durations are reported. Unsupported operations receive no timing.
dataset: blender/dataset.yaml
repetitions: 6
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  plakar: plakar
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression:
      algorithm: lz4
      level: 0
    jobs: 4
- label: plakar
  tool: plakar
