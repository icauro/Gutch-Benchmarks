name: gutch_vs_restic
description: Restic uses native Rabin around 1 MiB, explicit Zstd auto, 8 MiB pack targets and mandatory
  encryption. Gutch uses a nominal 1 MiB FastCDC target, Zstd 3, 8 MiB compressed bundles and no
  encryption. Zstd auto is not an exact level-3 match; bounds, codec implementations and compression
  units differ. Restore retains --verify; recovery verifies existing bytes and deletes extra files.
  Fresh repositories and isolated caches. Four workers where exposed; native Borg/BPT scheduling.
  One warm-up and six rotating measured repetitions; profiling off. Measurement contract 2 separates
  content repair, preserved-mtime damage, extra-file cleanup and full restoration. Strict source-derived
  SHA-256 validation follows every supported operation; both native and validation-inclusive durations
  are reported. Unsupported operations receive no timing.
dataset: blender/dataset.yaml
repetitions: 6
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  restic: restic
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression:
      algorithm: zstd
      level: 3
    jobs: 4
- label: restic
  tool: restic
  arguments:
  - --compression
  - auto
  - --pack-size
  - '8'
