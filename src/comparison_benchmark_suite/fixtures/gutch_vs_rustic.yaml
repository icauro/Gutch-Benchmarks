name: gutch_vs_rustic
description: Rustic explicitly uses Rabin with a 1 MiB average, 512 KiB minimum and 8 MiB maximum,
  Zstd 3, and 8 MiB data/tree pack targets with growth disabled. Gutch uses a nominal 1 MiB FastCDC
  target, Zstd 3 and 8 MiB compressed bundles. Chunk boundaries, compression units and hashes differ;
  Rustic remains encrypted. Recovery verifies existing bytes and deletes extra files. Fresh repositories
  and isolated caches. Four workers where exposed; native Borg/BPT scheduling. One warm-up and six
  rotating measured repetitions; profiling off. Measurement contract 2 separates content repair,
  preserved-mtime damage, extra-file cleanup and full restoration. Strict source-derived SHA-256
  validation follows every supported operation; both native and validation-inclusive durations are
  reported. Unsupported operations receive no timing.
dataset: blender/dataset.yaml
repetitions: 6
resource_sampling: true
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  rustic: rustic
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression:
      algorithm: zstd
      level: 3
    jobs: 4
- label: rustic
  tool: rustic
  arguments:
  - --set-compression
  - '3'
  - --set-chunker
  - rabin
  - --set-chunk-size
  - 1MiB
  - --set-chunk-min-size
  - 512kiB
  - --set-chunk-max-size
  - 8MiB
  - --set-datapack-size
  - 8MiB
  - --set-datapack-growfactor
  - '0'
  - --set-treepack-size
  - 8MiB
  - --set-treepack-growfactor
  - '0'
