name: gutch_vs_bpt
description: BuildPatchTool uses a 1 MiB chunk window and its internal compression with FeatureLevel=Latest.
  Local InstallManifest recovery uses PrevManifest. Gutch uses a nominal 1 MiB FastCDC target, Zstd
  3 and 8 MiB compressed bundles. Chunk windows are not CDC averages; codecs and formats are unmatched.
  No native extra-file cleanup or separate repository check is available in this adapter. Fresh repositories
  and isolated caches. Four workers where exposed; native Borg/BPT scheduling. One warm-up and six
  rotating measured repetitions; profiling off. Measurement contract 2 separates content repair,
  preserved-mtime damage, extra-file cleanup and full restoration. Strict source-derived SHA-256
  validation follows every supported operation; both native and validation-inclusive durations are
  reported. Unsupported operations receive no timing.
dataset: blender/dataset.yaml
repetitions: 6
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  buildpatchtool: BuildPatchTool
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression:
      algorithm: zstd
      level: 3
    jobs: 4
- label: buildpatchtool
  tool: buildpatchtool
  arguments:
  - -ChunkWindowSize=1048576
