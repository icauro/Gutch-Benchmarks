name: gutch_vs_kopia
description: Kopia explicitly uses DYNAMIC-4M-BUZHASH, disabled content compression and AES256-GCM-HMAC-SHA256
  encryption. Gutch uses a nominal 4 MiB FastCDC target, no compression, 16 MiB bundles and no encryption.
  Bounds, metadata, hashes and packing differ. Kopia recovery requests native extra-file deletion.
  Fresh repositories and isolated caches. Four workers where exposed; native Borg/BPT scheduling.
  One warm-up and six rotating measured repetitions; profiling off. Measurement contract 2 separates
  content repair, preserved-mtime damage, extra-file cleanup and full restoration. Strict source-derived
  SHA-256 validation follows every supported operation; both native and validation-inclusive durations
  are reported. Unsupported operations receive no timing.
dataset: blender/dataset.yaml
repetitions: 6
resource_sampling: true
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  kopia: kopia
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_4MiB
    compression:
      algorithm: none
    bundle: bundle_16MiB
    jobs: 4
- label: kopia
  tool: kopia
  arguments:
  - --compression=none
