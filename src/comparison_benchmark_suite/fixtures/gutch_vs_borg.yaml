name: gutch_vs_borg
description: Borg explicitly uses FastCDC fastcdc,19,23,21,2, LZ4, authenticated unencrypted storage
  and metadata-based resume. Gutch uses a nominal 2 MiB FastCDC target, LZ4 0 and 8 MiB compressed
  bundles. Bounds, hashes, compression framing and storage layout differ. Borg cannot detect preserved-mtime
  damage via resume and this adapter has no native extra-file cleanup. Fresh repositories and isolated
  caches. Four workers where exposed; native Borg/BPT scheduling. One warm-up and six rotating measured
  repetitions; profiling off. Measurement contract 2 separates content repair, preserved-mtime damage,
  extra-file cleanup and full restoration. Strict source-derived SHA-256 validation follows every
  supported operation; both native and validation-inclusive durations are reported. Unsupported operations
  receive no timing.
dataset: blender/dataset.yaml
repetitions: 6
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  borg: borg
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_2MiB
    compression:
      algorithm: lz4
      level: 0
    jobs: 4
- label: borg
  tool: borg
  arguments:
  - --chunker-params
  - fastcdc,19,23,21,2
  - --compression
  - lz4
