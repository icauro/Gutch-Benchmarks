name: gutch_vs_encrypted
description: Measures the cost of Gutch repository encryption. Both cases run the same Gutch release
  on the same runner with identical settings, a nominal 1 MiB FastCDC target, Zstd 3 and 8 MiB compressed
  bundles; only the second case encrypts its repository with AES-256-GCM, unlocked by a fixed local test
  password. Gutch relative compares unencrypted with encrypted Gutch. Fresh repositories and isolated
  caches. Four workers. One warm-up and six rotating measured repetitions; profiling off. Measurement
  contract 2 separates content repair, preserved-mtime damage, extra-file cleanup and full restoration.
  Strict source-derived SHA-256 validation follows every supported operation; both native and validation-inclusive
  durations are reported.
dataset: blender/dataset.yaml
repetitions: 6
resource_sampling: true
warmups: 1
profile_mode: 'off'
corrupt_repair: true
lane_wait_seconds: 0
step_wait_seconds: 0
executables:
  gutch: gutch-cli
  gutch_encrypted: gutch-cli
lanes:
- label: gutch
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression:
      algorithm: zstd
      level: 3
    jobs: 4
- label: gutch_encrypted
  tool: gutch
  profile:
    chunk: chunk_1MiB
    compression:
      algorithm: zstd
      level: 3
    jobs: 4
    encrypted: true
